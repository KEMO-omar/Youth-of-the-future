<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إدارة شهادات المواد | Admin 🎨</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        :root { --p: #ccff00; --bg: #0a0a0a; --cyan: #00f2ff; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: #fff; margin: 0; display: flex; height: 100vh; }
        
        .sidebar { width: 380px; background: #151515; padding: 20px; border-left: 1px solid #333; overflow-y: auto; }
        .control-group { background: #222; padding: 15px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #444; }
        label { display: block; margin-bottom: 8px; color: var(--cyan); font-weight: bold; font-size: 14px; }
        
        select, input[type="text"], input[type="range"] { 
            width: 100%; padding: 12px; background: #111; border: 1px solid #444; color: #fff; border-radius: 8px; margin-bottom: 10px; font-family: inherit;
        }

        .preview-pane { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #000; padding: 20px; }
        canvas { max-width: 100%; max-height: 75vh; border: 2px solid var(--p); border-radius: 10px; background: #111; }
        
        .btn-save { width: 100%; padding: 18px; background: var(--p); color: #000; border: none; border-radius: 10px; font-weight: 900; cursor: pointer; transition: 0.3s; font-size: 1rem; }
        .btn-save:hover { background: #fff; transform: translateY(-3px); box-shadow: 0 10px 20px rgba(204, 255, 0, 0.2); }
        .status { margin-top: 15px; font-weight: bold; text-align: center; }
        .hint { font-size: 11px; color: #888; margin-bottom: 10px; display: block; }
    </style>
</head>
<body>

<div class="sidebar">
    <h2 style="color: var(--p); text-align: center;">إعدادات شهادات المواد 🏆</h2>
    
    <div class="control-group">
        <label>1. اختر المادة المراد تعديلها:</label>
        <select id="subjectSelect" onchange="loadSubjectSettings()">
            <option value="science">العلوم المتكاملة 🧪</option>
            <option value="math">الرياضيات 📐</option>
            <option value="philosophy">الفلسفة والمنطق 🧠</option>
            <option value="history">التاريخ 📜</option>
            <option value="physics">الفيزياء ⚡</option>
        </select>
        <span class="hint">* كل مادة لها إعدادات منفصلة في الفايرباز</span>
    </div>

    <div class="control-group">
        <label>2. رابط صورة الشهادة (URL):</label>
        <input type="text" id="imgName" placeholder="ضع رابط الصورة المباشر هنا" oninput="updatePreview()">
    </div>

    <div class="control-group">
        <label>3. تخصيص الخط:</label>
        <label class="hint">اللون:</label>
        <input type="color" id="textColor" value="#003366" oninput="updatePreview()">
        <label class="hint">الحجم:</label>
        <input type="range" id="fontSize" min="2" max="15" value="6" step="0.1" oninput="updatePreview()">
    </div>

    <div class="control-group">
        <label>4. ضبط موقع الاسم:</label>
        <label class="hint">الارتفاع (Y):</label>
        <input type="range" id="yPos" min="0" max="100" value="50" oninput="updatePreview()">
        <label class="hint">التوسيط الأفقي (X):</label>
        <input type="range" id="xPos" min="0" max="100" value="50" oninput="updatePreview()">
    </div>

    <button class="btn-save" onclick="saveToFirebase()">حفظ إعدادات المادة 🚀</button>
    <div id="status" class="status"></div>
</div>

<div class="preview-pane">
    <div style="margin-bottom: 15px; text-align: center;">
        <span id="previewLabel" style="background: var(--cyan); color: #000; padding: 5px 15px; border-radius: 20px; font-weight: bold;">معاينة المادة</span>
    </div>
    <canvas id="editorCanvas"></canvas>
    <p style="color: #555; margin-top: 10px;">تحرك بالمؤشرات لضبط مكان اسم الطالب بدقة</p>
</div>

<script>
    // --- Firebase Configuration ---
    const firebaseConfig = {
        apiKey: "AIzaSyBMBd9C41EyU7kWi06CVMgXrYFBVAvU1v8",
        authDomain: "shapap-13c58.firebaseapp.com",
        projectId: "shapap-13c58",
        storageBucket: "shapap-13c58.firebasestorage.app",
        messagingSenderId: "818487036065",
        appId: "1:818487036065:web:350734adcc4fcd779c48e0"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const canvas = document.getElementById('editorCanvas');
    const ctx = canvas.getContext('2d');
    const template = new Image();
    template.crossOrigin = "anonymous"; // لتجنب مشاكل الـ CORS عند التحميل

    // تحميل الخط الخاص بك
    const font = new FontFace('KareemFont', "url('خط.ttf')");
    font.load().then(f => { 
        document.fonts.add(f); 
        updatePreview(); 
    }).catch(err => console.log("Font error: ", err));

    // جلب إعدادات المادة من Firestore
    async function loadSubjectSettings() {
        const subject = document.getElementById('subjectSelect').value;
        const status = document.getElementById('status');
        const selectedText = document.getElementById('subjectSelect').options[document.getElementById('subjectSelect').selectedIndex].text;
        
        document.getElementById('previewLabel').innerText = "معاينة: " + selectedText;
        status.innerText = "⏳ جاري تحميل إعدادات " + selectedText;

        try {
            const doc = await db.collection("subject_certs").doc(subject).get();
            if (doc.exists) {
                const data = doc.data();
                document.getElementById('imgName').value = data.img || '';
                document.getElementById('textColor').value = data.color || '#000000';
                document.getElementById('yPos').value = (data.yPos || 0.5) * 100;
                document.getElementById('xPos').value = (data.xPos || 0.5) * 100;
                document.getElementById('fontSize').value = (data.fontSize || 0.06) * 100;
                status.innerText = "✅ تم تحميل الإعدادات";
            } else {
                status.innerText = "ℹ️ لا توجد إعدادات مسبقة، ابدأ الضبط الآن";
                // قيم افتراضية لو المادة جديدة
                document.getElementById('imgName').value = '';
                document.getElementById('yPos').value = 50;
                document.getElementById('xPos').value = 50;
            }
        } catch (e) {
            console.error(e);
            status.innerText = "❌ خطأ في التحميل";
        }
        updatePreview();
    }

    function updatePreview() {
        const imgUrl = document.getElementById('imgName').value;
        if(!imgUrl) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#111";
            ctx.fillRect(0, 0, canvas.width || 300, canvas.height || 200);
            ctx.fillStyle = "#fff";
            ctx.textAlign = "center";
            ctx.fillText("برجاء وضع رابط الصورة", canvas.width/2, canvas.height/2);
            return;
        }

        template.src = imgUrl;
        template.onload = () => {
            canvas.width = template.width; 
            canvas.height = template.height;
            ctx.drawImage(template, 0, 0);
            
            const x = document.getElementById('xPos').value / 100;
            const y = document.getElementById('yPos').value / 100;
            const fSize = document.getElementById('fontSize').value / 100;
            
            ctx.font = `bold ${canvas.width * fSize}px 'KareemFont'`;
            ctx.fillStyle = document.getElementById('textColor').value;
            ctx.textAlign = 'center';
            ctx.fillText("اسم بطل المستقبل", canvas.width * x, canvas.height * y);
        };
    }

    async function saveToFirebase() {
        const subject = document.getElementById('subjectSelect').value;
        const status = document.getElementById('status');
        status.innerText = "⏳ جاري الحفظ في " + subject + "...";
        
        const config = {
            img: document.getElementById('imgName').value,
            color: document.getElementById('textColor').value,
            xPos: document.getElementById('xPos').value / 100,
            yPos: document.getElementById('yPos').value / 100,
            fontSize: document.getElementById('fontSize').value / 100,
            lastUpdate: new Date()
        };

        try {
            await db.collection("subject_certs").doc(subject).set(config, { merge: true });
            status.innerText = "✅ تم حفظ " + subject + " بنجاح!";
            status.style.color = "#ccff00";
        } catch (e) {
            status.innerText = "❌ فشل الحفظ!";
            status.style.color = "#ff4444";
            console.error(e);
        }
    }

    // التحميل عند فتح الصفحة لأول مرة
    window.onload = loadSubjectSettings;
</script>
</body>
</html>
