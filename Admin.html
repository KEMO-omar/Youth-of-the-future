<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة التحكم الاحترافية | إدارة شباب المستقبل ⚡</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Orbitron:wght@700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --p: #00f2ff; --s: #bc00ff; --a: #ccff00; --bg: #050505;
      --card: rgba(255, 255, 255, 0.05); --red: #ff4757; --green: #2ed573;
    }
    body { 
      margin: 0; background: var(--bg); color: #fff; font-family: 'Cairo', sans-serif;
      min-height: 100vh;
    }

    .admin-wrapper { max-width: 1100px; margin: 0 auto; padding: 20px; }
    
    .tabs-nav { 
      display: flex; gap: 10px; margin-bottom: 25px; overflow-x: auto; padding-bottom: 10px;
      position: sticky; top: 0; z-index: 100; background: var(--bg);
    }
    .tab-btn { 
      padding: 12px 20px; background: var(--card); border: 1px solid #333; color: #fff;
      border-radius: 15px; cursor: pointer; white-space: nowrap; font-weight: bold; transition: 0.3s;
    }
    .tab-btn.active { background: var(--p); color: #000; border-color: var(--p); box-shadow: 0 0 15px var(--p); }

    .tab-content { display: none; animation: fadeIn 0.5s ease; }
    .tab-content.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .glass-card { 
      background: var(--card); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 25px; padding: 25px; margin-bottom: 25px;
    }

    .table-container { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; min-width: 700px; }
    th { text-align: right; color: var(--p); border-bottom: 2px solid var(--p); padding: 10px; font-size: 0.9rem; }
    td { padding: 12px 10px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.85rem; }
    tr:hover { background: rgba(255,255,255,0.02); }
    .badge-cheat { background: var(--red); color: white; padding: 2px 6px; border-radius: 5px; font-size: 10px; margin-right: 5px; }

    input, select, textarea { 
      width: 100%; padding: 12px; margin: 8px 0; background: rgba(0,0,0,0.4); 
      border: 1px solid #444; border-radius: 10px; color: #fff; font-family: 'Cairo';
    }
    .btn { 
      padding: 10px 20px; border-radius: 10px; border: none; font-weight: 900; 
      cursor: pointer; transition: 0.3s; font-family: 'Cairo';
    }
    .btn-p { background: var(--p); color: #000; }
    .btn-red { background: var(--red); color: #fff; }

    #loginOverlay {
      position: fixed; inset: 0; background: var(--bg); z-index: 9999;
      display: flex; justify-content: center; align-items: center;
    }
  </style>
</head>
<body>

<div id="loginOverlay">
    <div class="glass-card" style="text-align: center; width: 350px;">
        <h2>🔐 دخول الإدارة</h2>
        <input type="password" id="adminKey" placeholder="كلمة المرور">
        <button class="btn btn-p" style="width: 100%;" onclick="verifyAdmin()">دخول</button>
    </div>
</div>

<div class="admin-wrapper">
    <div class="tabs-nav">
        <button class="tab-btn active" onclick="showTab('since-tab', this)">📁 ملف Since</button>
        <button class="tab-btn" onclick="showTab('exam-tab', this)">📝 إضافة امتحان</button>
        <button class="tab-btn" onclick="showTab('results-math', this)">📐 نتائج الرياضيات</button>
        <button class="tab-btn" onclick="showTab('results-science', this)">🧪 نتائج العلوم</button>
        <button class="tab-btn" onclick="showTab('manage-tab', this)">⚙️ إدارة الامتحانات</button>
    </div>

    <div id="since-tab" class="tab-content active">
        <div class="glass-card">
            <h2>إدارة ملف Since.html</h2>
            <input type="text" id="sinceUrl" placeholder="رابط الملف (مثلاً: Since.html)">
            <div style="display:flex; gap:10px;">
                <button class="btn btn-p" onclick="updateSince(true)">تفعيل وظهور</button>
                <button class="btn btn-red" onclick="updateSince(false)">إخفاء الملف</button>
            </div>
        </div>
    </div>

    <div id="exam-tab" class="tab-content">
        <div class="glass-card">
            <h2>إنشاء امتحان جديد</h2>
            <input type="text" id="exTitle" placeholder="عنوان الامتحان">
            <input type="text" id="exDesc" placeholder="وصف الامتحان">
            <input type="text" id="exUrl" placeholder="رابط الملف (مثلاً: quiz1.html)">
            <button class="btn btn-p" style="width:100%" onclick="saveExam()">حفظ ونشر الامتحان 🚀</button>
        </div>
    </div>

    <div id="results-math" class="tab-content">
        <div class="glass-card">
            <h2 style="color:var(--p)">🏆 أوائل اختبار الرياضيات</h2>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>الاسم</th>
                            <th>المجموعة</th>
                            <th>الواتساب</th>
                            <th>الدرجة</th>
                            <th>التوقيت</th>
                        </tr>
                    </thead>
                    <tbody id="mathBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="results-science" class="tab-content">
        <div class="glass-card">
            <h2 style="color:var(--s)">🧪 أوائل اختبار العلوم</h2>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>الاسم</th>
                            <th>الدرجة</th>
                            <th>الوقت (ث)</th>
                            <th>التاريخ</th>
                        </tr>
                    </thead>
                    <tbody id="scienceBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="manage-tab" class="tab-content">
        <div class="glass-card">
            <h2>التحكم في الامتحانات الحالية</h2>
            <div id="manageExamsList"></div>
        </div>
    </div>
</div>

<script>
  // --- إعدادات Firebase ---
  const firebaseConfig = {
      apiKey: "AIzaSyBMBd9C41EyU7kWi06CVMgXrYFBVAvU1v8",
      authDomain: "shapap-13c58.firebaseapp.com",
      databaseURL: "https://shapap-13c58-default-rtdb.firebaseio.com",
      projectId: "shapap-13c58",
      storageBucket: "shapap-13c58.firebasestorage.app",
      messagingSenderId: "818487036065",
      appId: "1:818487036065:web:350734adcc4fcd779c48e0"
  };
  
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const rdb = firebase.database();

  function verifyAdmin() {
      if(document.getElementById('adminKey').value === "1511") {
          document.getElementById('loginOverlay').style.display = 'none';
          loadData();
      } else {
          Swal.fire('خطأ', 'كلمة المرور غلط!', 'error');
      }
  }

  function showTab(tabId, btn) {
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      btn.classList.add('active');
  }

  async function updateSince(active) {
      const url = document.getElementById('sinceUrl').value || "Since.html";
      await db.collection("settings").doc("since_file").set({ url, active });
      Swal.fire('تم', 'تم تحديث حالة ملف Since', 'success');
  }

  async function saveExam() {
      const title = document.getElementById('exTitle').value;
      const desc = document.getElementById('exDesc').value;
      const url = document.getElementById('exUrl').value;
      if(!title || !url) return Swal.fire('نقص بيانات', 'املأ الحقول', 'warning');
      await db.collection("exams").add({ title, desc, url, createdAt: Date.now() });
      Swal.fire('تم النشر', 'الامتحان الآن متاح للطلاب', 'success');
  }

  function loadData() {
      // 1. تحميل نتائج الرياضيات (Realtime DB) + ترتيب الأوائل + كشف التكرار
      rdb.ref('results').on('value', snap => {
          const mathBody = document.getElementById('mathBody');
          mathBody.innerHTML = '';
          let data = [];
          snap.forEach(child => { data.push({id: child.key, ...child.val()}); });

          // ترتيب: الأعلى درجة أولاً
          data.sort((a, b) => b.score - a.score);

          // كشف التكرار بناءً على الاسم
          const namesCount = data.reduce((acc, curr) => {
              acc[curr.name] = (acc[curr.name] || 0) + 1;
              return acc;
          }, {});

          data.forEach(d => {
              const hasCheated = namesCount[d.name] > 1;
              mathBody.innerHTML += `
                  <tr>
                      <td>${hasCheated ? '<span class="badge-cheat">⚠️ مكرر</span>' : ''}${d.name}</td>
                      <td>${d.group || 'غير محدد'}</td>
                      <td>${d.phone || '---'}</td>
                      <td style="color:var(--a); font-weight:bold;">${d.score} / ${d.total}</td>
                      <td style="font-size:10px;">${d.timestamp}</td>
                  </tr>
              `;
          });
      });

      // 2. تحميل نتائج العلوم (Firestore) + ترتيب الأوائل
      db.collection("science_ranks").orderBy("score", "desc").orderBy("time", "asc").onSnapshot(snap => {
          const body = document.getElementById('scienceBody');
          body.innerHTML = '';
          
          let entries = [];
          snap.forEach(doc => entries.push(doc.data()));

          // كشف تكرار الأسماء في العلوم
          const scNames = entries.reduce((acc, curr) => {
              acc[curr.name] = (acc[curr.name] || 0) + 1;
              return acc;
          }, {});

          entries.forEach(d => {
              const date = new Date(d.at).toLocaleDateString('ar-EG');
              const isDuplicated = scNames[d.name] > 1;
              body.innerHTML += `
                  <tr>
                      <td>${isDuplicated ? '<span class="badge-cheat">⚠️ مكرر</span>' : ''}${d.name}</td>
                      <td style="color:var(--a)">${d.score}%</td>
                      <td>${d.time} ثانية</td>
                      <td>${date}</td>
                  </tr>
              `;
          });
      });

      // تحميل قائمة الامتحانات للحذف
      db.collection("exams").onSnapshot(snap => {
          const list = document.getElementById('manageExamsList');
          list.innerHTML = '';
          snap.forEach(doc => {
              list.innerHTML += `
                  <div style="display:flex; justify-content:space-between; padding:15px; border-bottom:1px solid #333; align-items:center;">
                      <span>${doc.data().title}</span>
                      <button class="btn btn-red" onclick="deleteExam('${doc.id}')"><i class="fa fa-trash"></i></button>
                  </div>
              `;
          });
      });
  }

  async function deleteExam(id) {
      const res = await Swal.fire({
          title: 'حذف الامتحان؟',
          text: "مش هتقدر ترجعه تاني!",
          icon: 'warning',
          showCancelButton: true,
          confirmButtonColor: '#ff4757',
          confirmButtonText: 'أيوه، احذف'
      });
      if(res.isConfirmed) {
          await db.collection("exams").doc(id).delete();
      }
  }
</script>
</body>
</html>
