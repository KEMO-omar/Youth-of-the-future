<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>كويز علوم متكاملة - مراجعة عبقرينو وكيمو 🏆</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

<style>
  :root {
    --bg: #0a0f1e; --surface: #111827; --card: #1a2235; --border: #2a3a55;
    --accent: #00d4ff; --accent2: #7c3aed; --green: #10b981; --red: #ef4444;
    --gold: #f59e0b; --text: #e2e8f0; --muted: #94a3b8;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; direction: rtl; overflow-x: hidden; }
  .container { max-width: 800px; margin: 0 auto; padding: 20px; }

  .header { text-align: center; padding: 20px 0; }
  .progress-container { width: 100%; height: 8px; background: var(--surface); border-radius: 10px; margin: 20px 0; overflow: hidden; border: 1px solid var(--border); }
  .progress-bar { height: 100%; background: linear-gradient(90deg, var(--accent2), var(--accent)); width: 0%; transition: 0.5s ease; }

  .score-bar { display: flex; justify-content: space-between; align-items: center; background: var(--card); padding: 15px 25px; border-radius: 16px; margin-bottom: 20px; border: 1px solid var(--border); }
  .val { font-size: 20px; font-weight: 900; color: var(--accent); }
  
  .question-card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 30px; transition: 0.3s; position: relative; }
  .question-text { font-size: 1.2rem; font-weight: 700; margin-bottom: 25px; line-height: 1.6; color: #fff; }
  
  .option { background: var(--surface); border: 2px solid var(--border); border-radius: 12px; padding: 15px; margin-bottom: 12px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 12px; }
  .option:hover { border-color: var(--accent); background: rgba(0,212,255,0.05); }
  .option.selected { border-color: var(--accent); background: rgba(0,212,255,0.1); box-shadow: 0 0 15px rgba(0,212,255,0.1); }

  .controls { display: flex; gap: 10px; margin-top: 20px; }
  .btn { flex: 1; padding: 15px; border-radius: 12px; border: none; font-weight: 700; cursor: pointer; transition: 0.3s; font-family: 'Cairo'; }
  .btn-primary { background: linear-gradient(135deg, var(--accent2), var(--accent)); color: white; }
  .btn-secondary { background: var(--border); color: var(--text); }
  .btn:disabled { opacity: 0.3; cursor: not-allowed; }

  .review-item { background: var(--surface); border-radius: 15px; padding: 20px; margin-bottom: 15px; border-right: 5px solid var(--border); text-align: right; }
  .status-badge { font-size: 12px; padding: 4px 10px; border-radius: 6px; margin-bottom: 10px; display: inline-block; color: #fff; font-weight: bold; }

  .results-screen { display: none; animation: fadeIn 0.8s ease; text-align: center; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

  /* تنسيق القائمة المنسدلة في SweetAlert */
  .swal2-select {
    background: #1a2235 !important;
    color: white !important;
    border: 1px solid var(--border) !important;
    border-radius: 10px !important;
    padding: 10px !important;
    font-family: 'Cairo', sans-serif !important;
  }
  .swal2-input {
    background: #1a2235 !important;
    color: white !important;
    border: 1px solid var(--border) !important;
    font-family: 'Cairo', sans-serif !important;
  }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1 style="font-family: 'Tajawal'; font-weight: 900;">مراجعة العلوم النهائية - 20 سؤالاً</h1>
    <div class="progress-container"><div id="progressBar" class="progress-bar"></div></div>
    <p id="studentDisplay" style="color: var(--accent); font-weight: bold; margin-top: 10px;"></p>
  </div>

  <div id="quizSection" style="display:none;">
    <div class="score-bar">
      <div><span class="val" id="timerVal">0</span> <small>ثانية</small></div>
      <div id="qCount" style="font-weight: bold; color: var(--muted);">1 / 20</div>
      <div><span class="val" id="scoreVal">0</span> <small>نقاط</small></div>
    </div>

    <div class="question-card">
      <div id="questionText" class="question-text"></div>
      <div id="optionsContainer"></div>
    </div>

    <div class="controls">
      <button class="btn btn-secondary" id="prevBtn" onclick="prevQuestion()">السابق</button>
      <button class="btn btn-primary" id="nextBtn" onclick="handleNext()">التالي</button>
    </div>
  </div>

  <div id="resultsScreen" class="results-screen">
    <div style="background: var(--card); padding: 40px; border-radius: 25px; border: 1px solid var(--border); margin-bottom: 30px;">
        <h2 style="color: var(--gold); font-size: 2rem; margin-bottom: 10px;">🏁 انتهى الاختبار</h2>
        <div id="finalScore" style="font-size: 4rem; font-weight: 900; margin: 20px 0; color: #fff;">0%</div>
        <p id="resultFeedback" style="font-size: 1.1rem; margin-bottom: 25px; color: var(--muted);"></p>
        <div style="display: flex; gap: 10px; justify-content: center;">
            <button class="btn btn-primary" onclick="toggleReview()" style="max-width: 200px;">مراجعة الإجابات</button>
            <button class="btn btn-secondary" onclick="resetQuiz()" style="max-width: 200px;">إعادة الاختبار</button>
        </div>
    </div>

    <div id="reviewSection" style="display:none; margin-top: 30px;">
        <h3 style="margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 10px; text-align: right; color: var(--accent);">📋 تقرير مراجعة الأخطاء:</h3>
        <div id="reviewList"></div>
    </div>

    <div id="leaderboardSection" style="margin-top: 40px; background: var(--card); padding: 25px; border-radius: 20px; border: 1px solid var(--accent);">
        <h3 style="color: var(--accent); margin-bottom: 15px; text-align: right;">🏆 لوحة الأوائل (Top 5)</h3>
        <div id="leaderboardList"></div>
    </div>
  </div>
</div>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyBMBd9C41EyU7kWi06CVMgXrYFBVAvU1v8",
    authDomain: "shapap-13c58.firebaseapp.com",
    projectId: "shapap-13c58",
    storageBucket: "shapap-13c58.firebasestorage.app",
    messagingSenderId: "818487036065",
    appId: "1:818487036065:web:350734adcc4fcd779c48e0"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// 20 سؤالاً جديداً تماماً من ملفات المراجعة
const rawQuestions = [
  { q: "ينتقل الكربون من النبات إلى الحيوان عبر عملية:", opts: ["التنفس", "التبخر", "التحلل", "التغذية"], ans: 3 },
  { q: "تحلل اليوريا في التربة بفعل البكتيريا ينتج عنه:", opts: ["أمونيا ثم نترات", "غاز أكسجين", "فوسفات صخري", "صدى صوتي"], ans: 0 },
  { q: "العملية التي تحرر الفوسفور من الصخور تسمى:", opts: ["التنفس", "التبخر", "التجوية", "النيترة"], ans: 2 },
  { q: "تعتمد قوة ارتداد الموجات فوق الصوتية في التشخيص الطبي على:", opts: ["لون العضو", "درجة الحرارة", "المقاومة الصوتية للنسيج", "كمية اليوريا"], ans: 2 },
  { q: "أي من الحجرات التالية في القلب تستقبل الدم العائد من الرئتين؟", opts: ["البطين الأيمن", "الأذين الأيسر", "الأذين الأيمن", "البطين الأيسر"], ans: 1 },
  { q: "الشريان الوحيد في جسم الإنسان الذي يحمل دماً غير مؤكسج هو:", opts: ["الشريان الأورطي", "الشريان الكلوي", "الشريان الرئوي", "الشريان الكبدي"], ans: 2 },
  { q: "ما هي وحدة التنقية (الفلترة) الأساسية داخل الكلى؟", opts: ["الحالب", "النفيرون", "المثانة", "الكبد"], ans: 1 },
  { q: "تعتمد لزوجة الدم في المقام الأول على تركيز:", opts: ["الجلوكوز", "الهيموجلوبين", "الأملاح", "الماء"], ans: 1 },
  { q: "أعلى ضغط دم في الدورة الدموية يكون عند:", opts: ["الوريد الأجوف", "الشريان الرئوي", "الشريان الأورطي", "الشعيرات الدموية"], ans: 2 },
  { q: "تتم عملية تبادل الغازات في الرئتين داخل:", opts: ["الشعيبات الهوائية", "الحويصلات الهوائية", "القصيبات", "البلعوم"], ans: 1 },
  { q: "المسؤول عن نقل السكر والغذاء الجاهز من الأوراق إلى باقي أجزاء النبات هو:", opts: ["الخشب", "اللحاء", "النخاع", "البشرة"], ans: 1 },
  { q: "أي من العمليات التالية تساهم في تلطيف درجة حرارة النبات في الصيف؟", opts: ["التنفس", "النتح", "البناء الضوئي", "التحلل"], ans: 1 },
  { q: "تُعتبر الفضلات النيتروجينية نتاجاً لتكسير:", opts: ["السكريات", "الدهون", "البروتينات", "الفيتامينات"], ans: 2 },
  { q: "العلاقة بين ضغط الدم واللزوجة هي علاقة:", opts: ["عكسية", "طردية", "ثابتة", "لا توجد علاقة"], ans: 1 },
  { q: "دورة الكربون يتم فيها إطلاق غاز CO2 للغلاف الجوي عبر:", opts: ["البناء الضوئي", "التبخر", "التنفس والاحتراق", "الترسيب"], ans: 2 },
  { q: "عند فحص الكبد، يساهم جهاز السونار في تحديد:", opts: ["نسبة السكر", "كفاءة الفلترة", "حجم الكبد وتواجد تليفات", "كمية البول"], ans: 2 },
  { q: "في الدورة الدموية الصغرى، يخرج الدم من البطين الأيمن متجهاً إلى:", opts: ["الكبد", "الرئتين", "الدماغ", "الأطراف"], ans: 1 },
  { q: "المركب الذي يمثل 'عملة الطاقة' في الخلية هو:", opts: ["DNA", "ATP", "RNA", "الماء"], ans: 1 },
  { q: "يقوم الجلد بالتخلص من الفضلات والأملاح الزائدة عن طريق:", opts: ["الدهون", "الغدد العرقية", "المسام التنفسية", "الشعيرات"], ans: 1 },
  { q: "لماذا لا يمثل الفوسفور ملوثاً للغلاف الجوي عادة؟", opts: ["لأنه غاز خامل", "لأنه لا يتواجد في حالة غازية طبيعياً", "لأنه يذوب في الماء", "لأنه مفيد جداً"], ans: 1 }
];

let questions = [];
let currentIdx = 0;
let userAnswers = Array(20).fill(-1);
let studentData = { name: "", phone: "", group: "" };
let timer = 0;
let timerInt;

async function startQuiz() {
    const savedScore = localStorage.getItem('last_quiz_score');
    if (savedScore) {
        const data = JSON.parse(savedScore);
        Swal.fire({
            title: 'مرحباً مجدداً!',
            html: `أهلاً ${data.name}<br>نتيجتك السابقة: <b>${data.score}%</b>`,
            icon: 'info',
            background: '#111827', color: '#fff'
        });
    }

    const { value: formValues } = await Swal.fire({
        title: 'امتحان علوم كريم وعبقرينو ادخل بياناتك',
        html:
            '<input id="swal-input1" class="swal2-input" placeholder="الاسم بالكامل">' +
            '<input id="swal-input2" class="swal2-input" placeholder="رقم الواتساب">' +
            '<select id="swal-input3" class="swal2-select" style="width: 80%; margin: 10px auto; display: block;">' +
            '<option value="" disabled selected>اختر مجموعتك</option>' +
            '<option value="الدراسه الاعظم">الدراسه الاعظم</option>' +
            '<option value="شباب المستقبل">شباب المستقبل</option>' +
            '<option value="طلاب اولى ثانوي ازهر و عام">طلاب اولى ثانوي ازهر و عام</option>' +
            '<option value="اولى ثانوي">اولى ثانوي</option>' +
            '<option value="الطريق الى النجاح">الطريق الى النجاح</option>' +
          '<option value="قناة دفعة اولى ثانوى 2026">قناة دفعة اولى ثانوي 2026</option>' +
            '</select>',
        focusConfirm: false,
        confirmButtonText: 'ابدأ التحدي 🚀',
        background: '#111827', color: '#fff',
        preConfirm: () => {
            const name = document.getElementById('swal-input1').value;
            const phone = document.getElementById('swal-input2').value;
            const group = document.getElementById('swal-input3').value;
            if (!name || !phone || !group) Swal.showValidationMessage('الرجاء إكمال البيانات');
            return { name, phone, group };
        }
    });

    if (formValues) {
        studentData = formValues;
        document.getElementById('studentDisplay').innerText = `المتسابق: ${studentData.name}`;
        questions = rawQuestions.sort(() => Math.random() - 0.5).map(q => {
            const correctText = q.opts[q.ans];
            const shuffled = [...q.opts].sort(() => Math.random() - 0.5);
            return { q: q.q, opts: shuffled, ans: shuffled.indexOf(correctText) };
        });
        document.getElementById('quizSection').style.display = 'block';
        startTimer();
        renderQuestion();
    }
}

function renderQuestion() {
    const q = questions[currentIdx];
    document.getElementById('qCount').innerText = `${currentIdx + 1} / 20`;
    document.getElementById('questionText').innerText = q.q;
    const container = document.getElementById('optionsContainer');
    container.innerHTML = '';
    q.opts.forEach((opt, i) => {
        const div = document.createElement('div');
        div.className = `option ${userAnswers[currentIdx] === i ? 'selected' : ''}`;
        div.innerHTML = `<span>${opt}</span>`;
        div.onclick = () => { userAnswers[currentIdx] = i; renderQuestion(); };
        container.appendChild(div);
    });
    document.getElementById('progressBar').style.width = `${((currentIdx + 1) / 20) * 100}%`;
    document.getElementById('prevBtn').disabled = currentIdx === 0;
    document.getElementById('nextBtn').innerText = currentIdx === 19 ? 'تسليم الاختبار 🏁' : 'التالي ←';
}

function prevQuestion() { if(currentIdx > 0) { currentIdx--; renderQuestion(); } }

function handleNext() {
    if (userAnswers[currentIdx] === -1) {
        Swal.fire({ icon: 'warning', text: 'اختر إجابة أولاً', background: '#111827', color: '#fff' });
        return;
    }
    if(currentIdx < 19) { currentIdx++; renderQuestion(); } else { confirmSubmit(); }
}

async function confirmSubmit() {
    const { isConfirmed } = await Swal.fire({
        title: 'هل تريد التسليم؟',
        icon: 'question',
        showCancelButton: true,
        confirmButtonText: 'نعم، سلم الآن',
        background: '#111827', color: '#fff'
    });
    if(isConfirmed) finishQuiz();
}

async function finishQuiz() {
    clearInterval(timerInt);
    let score = 0;
    questions.forEach((q, i) => { if(userAnswers[i] === q.ans) score++; });
    const pct = Math.round((score / 20) * 100);

    localStorage.setItem('last_quiz_score', JSON.stringify({ name: studentData.name, score: pct }));

    document.getElementById('quizSection').style.display = 'none';
    document.getElementById('resultsScreen').style.display = 'block';
    document.getElementById('finalScore').innerText = `${pct}%`;

    await db.collection("science_ranks").add({ 
        name: studentData.name, 
        phone: studentData.phone,
        group: studentData.group,
        score: pct, 
        time: timer, 
        at: Date.now() 
    });
    
    generateReview();
    showLeaderboard();
}

function generateReview() {
    const container = document.getElementById('reviewList');
    container.innerHTML = '';
    questions.forEach((q, i) => {
        const isCorrect = userAnswers[i] === q.ans;
        const div = document.createElement('div');
        div.className = 'review-item';
        div.style.borderRightColor = isCorrect ? '#10b981' : '#ef4444';
        div.innerHTML = `
            <span class="status-badge" style="background:${isCorrect ? '#10b981' : '#ef4444'}">${isCorrect ? 'صح' : 'خطأ'}</span>
            <p>س ${i+1}: ${q.q}</p>
            <p>إجابتك: ${userAnswers[i] !== -1 ? q.opts[userAnswers[i]] : 'لا يوجد'}</p>
            ${!isCorrect ? `<p style="color:#10b981">الصح: ${q.opts[q.ans]}</p>` : ''}
        `;
        container.appendChild(div);
    });
}

function toggleReview() {
    const sec = document.getElementById('reviewSection');
    sec.style.display = sec.style.display === 'none' ? 'block' : 'none';
}

function startTimer() { timerInt = setInterval(() => { timer++; document.getElementById('timerVal').innerText = timer; }, 1000); }

async function showLeaderboard() {
    const listDiv = document.getElementById('leaderboardList');
    const snap = await db.collection("science_ranks").orderBy("score", "desc").orderBy("time", "asc").limit(5).get();
    listDiv.innerHTML = '';
    snap.forEach((doc, i) => {
        const d = doc.data();
        listDiv.innerHTML += `<div style="display:flex; justify-content:space-between; padding:10px; border-bottom:1px solid var(--border)">
            <span>${i+1}. ${d.name}</span>
            <span><b>${d.score}%</b> (${d.time}ث)</span>
        </div>`;
    });
}

function resetQuiz() { location.reload(); }
window.onload = startQuiz;
</script>
</body>
</html>
