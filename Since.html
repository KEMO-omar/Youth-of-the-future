<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>كويز علوم متكاملة - تجربة احترافية 🏆</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

<style>
  :root {
    --bg: #0a0f1e; --surface: #111827; --card: #1a2235; --border: #2a3a55;
    --accent: #00d4ff; --accent2: #7c3aed; --green: #10b981; --red: #ef4444;
    --gold: #f59e0b; --text: #e2e8f0; --muted: #94a3b8;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; direction: rtl; overflow-x: hidden; }
  .container { max-width: 800px; margin: 0 auto; padding: 20px; }

  .header { text-align: center; padding: 20px 0; }
  .progress-container { width: 100%; height: 8px; background: var(--surface); border-radius: 10px; margin: 20px 0; overflow: hidden; border: 1px solid var(--border); }
  .progress-bar { height: 100%; background: linear-gradient(90deg, var(--accent2), var(--accent)); width: 0%; transition: 0.5s ease; }

  .score-bar { display: flex; justify-content: space-between; align-items: center; background: var(--card); padding: 15px 25px; border-radius: 16px; margin-bottom: 20px; border: 1px solid var(--border); }
  .val { font-size: 20px; font-weight: 900; color: var(--accent); }
  
  .question-card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 30px; transition: 0.3s; position: relative; }
  .question-text { font-size: 1.2rem; font-weight: 700; margin-bottom: 25px; line-height: 1.6; color: #fff; }
  
  .option { background: var(--surface); border: 2px solid var(--border); border-radius: 12px; padding: 15px; margin-bottom: 12px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 12px; }
  .option:hover { border-color: var(--accent); background: rgba(0,212,255,0.05); }
  .option.selected { border-color: var(--accent); background: rgba(0,212,255,0.1); box-shadow: 0 0 15px rgba(0,212,255,0.1); }

  .controls { display: flex; gap: 10px; margin-top: 20px; }
  .btn { flex: 1; padding: 15px; border-radius: 12px; border: none; font-weight: 700; cursor: pointer; transition: 0.3s; font-family: 'Cairo'; }
  .btn-primary { background: linear-gradient(135deg, var(--accent2), var(--accent)); color: white; }
  .btn-secondary { background: var(--border); color: var(--text); }
  .btn:disabled { opacity: 0.3; cursor: not-allowed; }

  .review-item { background: var(--surface); border-radius: 15px; padding: 20px; margin-bottom: 15px; border-right: 5px solid var(--border); text-align: right; }
  .status-badge { font-size: 12px; padding: 4px 10px; border-radius: 6px; margin-bottom: 10px; display: inline-block; color: #fff; font-weight: bold; }

  .results-screen { display: none; animation: fadeIn 0.8s ease; text-align: center; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1 style="font-family: 'Tajawal'; font-weight: 900;">انتقال الطاقة في النظام البيئي</h1>
    <div class="progress-container"><div id="progressBar" class="progress-bar"></div></div>
    <p id="studentDisplay" style="color: var(--accent); font-weight: bold; margin-top: 10px;"></p>
  </div>

  <div id="quizSection" style="display:none;">
    <div class="score-bar">
      <div><span class="val" id="timerVal">0</span> <small>ثانية</small></div>
      <div id="qCount" style="font-weight: bold; color: var(--muted);">1 / 15</div>
      <div><span class="val" id="scoreVal">0</span> <small>نقاط</small></div>
    </div>

    <div class="question-card">
      <div id="questionText" class="question-text"></div>
      <div id="optionsContainer"></div>
    </div>

    <div class="controls">
      <button class="btn btn-secondary" id="prevBtn" onclick="prevQuestion()">السابق</button>
      <button class="btn btn-primary" id="nextBtn" onclick="handleNext()">التالي</button>
    </div>
  </div>

  <div id="resultsScreen" class="results-screen">
    <div style="background: var(--card); padding: 40px; border-radius: 25px; border: 1px solid var(--border); margin-bottom: 30px;">
        <h2 style="color: var(--gold); font-size: 2rem; margin-bottom: 10px;">🏁 انتهى الاختبار</h2>
        <div id="finalScore" style="font-size: 4rem; font-weight: 900; margin: 20px 0; color: #fff;">0%</div>
        <p id="resultFeedback" style="font-size: 1.1rem; margin-bottom: 25px; color: var(--muted);"></p>
        <div style="display: flex; gap: 10px; justify-content: center;">
            <button class="btn btn-primary" onclick="toggleReview()" style="max-width: 200px;">مراجعة الإجابات</button>
            <button class="btn btn-secondary" onclick="resetQuiz()" style="max-width: 200px;">إعادة الاختبار</button>
        </div>
    </div>

    <div id="reviewSection" style="display:none; margin-top: 30px;">
        <h3 style="margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 10px; text-align: right; color: var(--accent);">📋 تقرير مراجعة الأخطاء:</h3>
        <div id="reviewList"></div>
    </div>

    <div id="leaderboardSection" style="margin-top: 40px; background: var(--card); padding: 25px; border-radius: 20px; border: 1px solid var(--accent);">
        <h3 style="color: var(--accent); margin-bottom: 15px; text-align: right;">🏆 لوحة الأوائل (Top 5)</h3>
        <div id="leaderboardList"></div>
    </div>
  </div>
</div>

<script>
// --- الإعدادات ---
const firebaseConfig = {
    apiKey: "AIzaSyBMBd9C41EyU7kWi06CVMgXrYFBVAvU1v8",
    authDomain: "shapap-13c58.firebaseapp.com",
    projectId: "shapap-13c58",
    storageBucket: "shapap-13c58.firebasestorage.app",
    messagingSenderId: "818487036065",
    appId: "1:818487036065:web:350734adcc4fcd779c48e0"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const rawQuestions = [
  { q: "أي من المخلوقات الحية التالية يُعتبر ذاتي التغذية (Autotroph)؟", opts: ["الأرنب", "الأسد", "طحلب أخضر", "الضبع"], ans: 2 },
  { q: "تنتقل الطاقة بين المستويات الغذائية المتتالية بنسبة لا تتجاوز:", opts: ["1%", "50%", "10%", "25%"], ans: 2 },
  { q: "ما المقصود بـ 'الشبكة الغذائية'؟", opts: ["سلسلة واحدة خطية", "مجموعة سلاسل متشابكة", "علاقة بين نبات وحيوان", "تدفق المياه"], ans: 1 },
  { q: "الكائنات التي تحصل على طاقتها بأكل كائنات أخرى تُسمى:", opts: ["ذاتية التغذية", "مستهلكات", "منتجات أولية", "المحللات"], ans: 1 },
  { q: "في هرم الطاقة، أي المستويات يمتلك أعلى كمية من الطاقة؟", opts: ["المستهلكات الثانوية", "المستهلكات الأولية", "المستهلكات الثالثية", "المنتجات الأولية"], ans: 3 },
  { q: "آكلات الأعشاب مثل الأرانب والبقر تُصنَّف ضمن:", opts: ["المنتجات الأولية", "المستهلكات الأولية", "المستهلكات الثانوية", "المحللات"], ans: 1 },
  { q: "الفطريات والبكتيريا التي تحلل المواد العضوية الميتة تسمى:", opts: ["منتجات", "مفترسات", "المحللات", "آكلات أعشاب"], ans: 2 },
  { q: "في السلسلة: عشب ← جراد ← ضفدع ← أفعى، الضفدع يُعتبر:", opts: ["منتجاً", "مستهلكاً أولياً", "مستهلكاً ثانوياً", "محللاً"], ans: 2 },
  { q: "ما مصدر الطاقة الأساسي لمعظم النظم البيئية؟", opts: ["الحرارة الأرضية", "الطاقة الكيميائية", "ضوء الشمس", "طاقة الرياح"], ans: 2 },
  { q: "هرم الأعداد يمثل في كل مستوى غذائي:", opts: ["كمية الطاقة", "الكتلة الحيوية", "عدد الأفراد", "نسبة الانتقال"], ans: 2 },
  { q: "المخلوقات التي تتغذى على أجزاء من المواد الميتة تُسمى:", opts: ["مستهلكات ثانية", "منتجات", "المخلوقات الكانسة", "آكلات أعشاب"], ans: 2 },
  { q: "الكتلة الحيوية (Biomass) تعني:", opts: ["الطاقة المفقودة", "إجمالي كتلة المادة الحية", "تنوع الأنواع", "كمية CO2"], ans: 1 },
  { q: "في عملية البناء الضوئي، ينتج النبات:", opts: ["CO2 وماء", "جلوكوز وأكسجين", "طاقة وحرارة", "نيتروجين"], ans: 1 },
  { q: "لماذا تُعتبر النباتات أساساً لكل النظم البيئية؟", opts: ["لأنها الأكثر عدداً", "لأنها توفر الطاقة للجميع", "لأنها تتحلل بسرعة", "لأنها تمتص حرارة الأرض"], ans: 1 },
  { q: "إذا كان المنتج يحتوي على 10,000 وحدة طاقة، كم يصل للمستهلك الثانوي؟", opts: ["1000 وحدة", "100 وحدة", "500 وحدة", "5000 وحدة"], ans: 1 }
];

let questions = [];
let currentIdx = 0;
let userAnswers = Array(15).fill(-1);
let studentData = { name: "", phone: "", group: "" };
let timer = 0;
let timerInt;

async function startQuiz() {
    // التحقق من وجود نتيجة محفوظة
    const savedScore = localStorage.getItem('last_quiz_score');
    if (savedScore) {
        const data = JSON.parse(savedScore);
        Swal.fire({
            title: 'لديك نتيجة سابقة!',
            html: `أهلاً ${data.name}<br>درجتك الأخيرة هي: <b>${data.score}%</b>`,
            icon: 'info',
            confirmButtonText: 'إعادة الاختبار',
            background: '#111827', color: '#fff'
        });
    }

    const { value: formValues } = await Swal.fire({
        title: 'مرحباً بك يا بطل',
        html:
            '<input id="swal-input1" class="swal2-input" placeholder="الاسم بالكامل">' +
            '<input id="swal-input2" class="swal2-input" placeholder="رقم الواتساب">' +
            '<select id="swal-input3" class="swal2-input">' +
            '<option value="" disabled selected>اختر مجموعتك</option>' +
            '<option value="الدراسه الاعظم">الدراسه الاعظم</option>' +
            '<option value="شباب المستقبل">شباب المستقبل</option>' +
            '<option value="طلاب اولى ثانوي ازهر و عام">طلاب اولى ثانوي ازهر و عام</option>' +
            '<option value="اولى ثانوي">اولى ثانوي</option>' +
            '<option value="الطريق الى الجنه">الطريق الى الجنه</option>' +
            '</select>',
        focusConfirm: false,
        confirmButtonText: 'ابدأ الآن 🚀',
        allowOutsideClick: false,
        background: '#111827', color: '#fff',
        preConfirm: () => {
            const name = document.getElementById('swal-input1').value;
            const phone = document.getElementById('swal-input2').value;
            const group = document.getElementById('swal-input3').value;
            if (!name || !phone || !group) {
                Swal.showValidationMessage('الرجاء إكمال جميع البيانات');
            }
            return { name, phone, group };
        }
    });

    if (formValues) {
        studentData = formValues;
        document.getElementById('studentDisplay').innerText = `المتسابق: ${studentData.name} | ${studentData.group}`;
        
        questions = rawQuestions.sort(() => Math.random() - 0.5).map(q => {
            const correctText = q.opts[q.ans];
            const shuffled = [...q.opts].sort(() => Math.random() - 0.5);
            return { q: q.q, opts: shuffled, ans: shuffled.indexOf(correctText) };
        });

        document.getElementById('quizSection').style.display = 'block';
        startTimer();
        renderQuestion();
    }
}

function renderQuestion() {
    const q = questions[currentIdx];
    document.getElementById('qCount').innerText = `${currentIdx + 1} / ${questions.length}`;
    document.getElementById('questionText').innerText = q.q;
    const container = document.getElementById('optionsContainer');
    container.innerHTML = '';

    q.opts.forEach((opt, i) => {
        const div = document.createElement('div');
        div.className = `option ${userAnswers[currentIdx] === i ? 'selected' : ''}`;
        div.innerHTML = `<span>${opt}</span>`;
        div.onclick = () => {
            userAnswers[currentIdx] = i;
            renderQuestion();
        };
        container.appendChild(div);
    });

    document.getElementById('progressBar').style.width = `${((currentIdx + 1) / questions.length) * 100}%`;
    document.getElementById('prevBtn').disabled = currentIdx === 0;
    document.getElementById('nextBtn').innerText = currentIdx === questions.length - 1 ? 'تسليم الاختبار 🏁' : 'التالي ←';
}

function prevQuestion() { if(currentIdx > 0) { currentIdx--; renderQuestion(); } }

function handleNext() {
    if (userAnswers[currentIdx] === -1) {
        Swal.fire({ icon: 'warning', text: 'الرجاء اختيار إجابة للمتابعة', background: '#111827', color: '#fff' });
        return;
    }
    if(currentIdx < questions.length - 1) {
        currentIdx++;
        renderQuestion();
    } else {
        confirmSubmit();
    }
}

async function confirmSubmit() {
    const { isConfirmed } = await Swal.fire({
        title: 'إنهاء الاختبار؟',
        text: 'هل أنت متأكد من تسليم جميع الإجابات؟',
        icon: 'question',
        showCancelButton: true,
        confirmButtonText: 'نعم، سلم الآن',
        cancelButtonText: 'مراجعة الأسئلة',
        background: '#111827', color: '#fff'
    });
    if(isConfirmed) finishQuiz();
}

async function finishQuiz() {
    clearInterval(timerInt);
    let finalScore = 0;
    questions.forEach((q, i) => { if(userAnswers[i] === q.ans) finalScore++; });
    const finalPct = Math.round((finalScore / questions.length) * 100);

    // حفظ في المتصفح (LocalStorage)
    localStorage.setItem('last_quiz_score', JSON.stringify({
        name: studentData.name,
        score: finalPct,
        at: Date.now()
    }));

    document.getElementById('quizSection').style.display = 'none';
    document.getElementById('resultsScreen').style.display = 'block';
    document.getElementById('finalScore').innerText = `${finalPct}%`;
    document.getElementById('resultFeedback').innerText = finalPct >= 50 ? "أداء متميز! استمر في التقدم." : "تحتاج إلى مزيد من المذاكرة، حاول مرة أخرى.";

    // الحفظ في Firebase مع البيانات الجديدة
    await db.collection("science_ranks").add({ 
        name: studentData.name, 
        phone: studentData.phone,
        group: studentData.group,
        score: finalPct, 
        time: timer, 
        at: Date.now() 
    });
    
    generateReview();
    showLeaderboard();
}

function resetQuiz() {
    location.reload();
}

function generateReview() {
    const container = document.getElementById('reviewList');
    container.innerHTML = '';
    questions.forEach((q, i) => {
        const isCorrect = userAnswers[i] === q.ans;
        const div = document.createElement('div');
        div.className = 'review-item';
        div.style.borderRightColor = isCorrect ? '#10b981' : '#ef4444';
        div.innerHTML = `
            <span class="status-badge" style="background:${isCorrect ? '#10b981' : '#ef4444'}">${isCorrect ? 'إجابة صحيحة' : 'إجابة خاطئة'}</span>
            <p style="font-weight:bold; margin-bottom:5px;">س ${i+1}: ${q.q}</p>
            <p>إجابتك: <span style="color:${isCorrect ? '#10b981' : '#ef4444'}">${userAnswers[i] !== -1 ? q.opts[userAnswers[i]] : 'لم يتم الإجابة'}</span></p>
            ${!isCorrect ? `<p style="color:#10b981">الإجابة الصحيحة: ${q.opts[q.ans]}</p>` : ''}
        `;
        container.appendChild(div);
    });
}

function toggleReview() {
    const sec = document.getElementById('reviewSection');
    sec.style.display = sec.style.display === 'none' ? 'block' : 'none';
    if(sec.style.display === 'block') sec.scrollIntoView({ behavior: 'smooth' });
}

function startTimer() { timerInt = setInterval(() => { timer++; document.getElementById('timerVal').innerText = timer; }, 1000); }

async function showLeaderboard() {
    const listDiv = document.getElementById('leaderboardList');
    listDiv.innerHTML = '<p>جاري تحميل المتصدرين...</p>';
    const snap = await db.collection("science_ranks").orderBy("score", "desc").orderBy("time", "asc").limit(5).get();
    listDiv.innerHTML = '';
    snap.forEach((doc, i) => {
        const d = doc.data();
        listDiv.innerHTML += `<div style="display:flex; justify-content:space-between; padding:12px; border-bottom:1px solid var(--border)">
            <span>${i+1}. ${d.name} (${d.group})</span>
            <span><b>${d.score}%</b> <small style="color:var(--muted)">(${d.time}ث)</small></span>
        </div>`;
    });
}

window.onload = startQuiz;
</script>
</body>
</html>
