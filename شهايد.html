<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ستوديو تصميم الشهادات الملكي | كيمو 🛠️✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background: #050505; color: #fff; display: flex; gap: 15px; padding: 15px; margin: 0; height: 100vh; box-sizing: border-box; overflow: hidden; }
        
        /* لوحة التحكم */
        .controls { width: 380px; background: #111; padding: 20px; border-radius: 15px; border: 1px solid #222; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; scrollbar-width: thin; scrollbar-color: #333 #111; }
        
        /* منطقة المعاينة */
        .preview-area { flex-grow: 1; background: #000; border-radius: 15px; border: 2px dashed #333; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; padding: 10px; }
        
        h2 { color: #00f2ff; font-size: 1.3rem; margin: 0 0 10px 0; text-align: center; border-bottom: 1px solid #222; padding-bottom: 10px; }
        .section-title { font-size: 0.9rem; color: #00f2ff; margin-top: 15px; font-weight: bold; border-right: 3px solid #00f2ff; padding-right: 8px; }
        
        label { display: block; font-size: 0.85rem; color: #aaa; margin-top: 8px; }
        input, select, button { width: 100%; padding: 10px; margin-top: 4px; background: #1a1a1a; border: 1px solid #333; color: #fff; border-radius: 8px; box-sizing: border-box; font-family: 'Cairo'; }
        input[type="range"] { padding: 0; height: 10px; cursor: pointer; }
        
        /* تنسيق التحكم في اللون المطور */
        .color-group { display: flex; gap: 10px; align-items: center; }
        input[type="color"] { width: 50px; height: 40px; padding: 2px; border: none; cursor: pointer; background: transparent; }
        .color-presets { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 5px; }
        .color-picker-btn { width: 25px; height: 25px; border-radius: 50%; border: 2px solid #333; cursor: pointer; transition: 0.2s; }
        .color-picker-btn:hover { transform: scale(1.1); border-color: #fff; }

        /* تنسيق السلايدرات (الزوايا) */
        .sliders-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

        .btn-main { background: #00f2ff; color: #000; border: none; padding: 15px; margin-top: 15px; border-radius: 10px; font-weight: 900; cursor: pointer; font-size: 1.1rem; transition: 0.3s; }
        .btn-main:hover { background: #fff; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0, 242, 255, 0.3); }
        .btn-secondary { background: #222; color: #aaa; border: 1px solid #333; margin-top: 5px; }
        .btn-secondary:hover { background: #333; color: #fff; }

        canvas { max-width: 100%; max-height: 90vh; box-shadow: 0 15px 50px rgba(0,0,0,0.8); border-radius: 10px; }
        .status-bar { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 5px 10px; border-radius: 5px; font-size: 0.8rem; color: #666; pointer-events: none; z-index: 10; }
    </style>
</head>
<body>

<div class="controls">
    <h2>ستوديو كيمو الملكي 👑</h2>
    
    <div class="section-title">1. تصميم الشهادة</div>
    <label>ارفع ملف الصورة (JPG/PNG):</label>
    <input type="file" id="bgFileInput" accept="image/*">
    
    <label>أو ضع رابط صورة الشهادة مباشرة:</label>
    <div style="display:flex; gap:5px;">
        <input type="url" id="bgUrlInput" placeholder="https://example.com/cert.png">
        <button class="btn-secondary" id="loadUrlBtn" style="width:auto;">تحميل</button>
    </div>

    <div class="section-title">2. إعدادات الاسم</div>
    <label>ارفع ملف الخط (TTF/OTF) - سيتم حفظه:</label>
    <input type="file" id="fontFileInput" accept=".ttf,.otf">
    
    <label>أو اختر من خطوطك المحفوظة:</label>
    <select id="savedFontsSelect">
        <option value="">-- اختر خطاً محفوظاً --</option>
    </select>

    <label>اسم الطالب:</label>
    <input type="text" id="studentName" placeholder="اكتب الاسم المربع هنا..." value="كريم عمر">

    <div class="section-title">3. لون الخط وشفافيته</div>
    <div class="color-group">
        <input type="color" id="fontColor" value="#5C3A27">
        <input type="text" id="colorHex" value="#5C3A27" style="width: 100px; text-transform: uppercase;">
    </div>
    <div class="color-presets">
        <div class="color-picker-btn" style="background:#5C3A27;" onclick="setColor('#5C3A27')"></div>
        <div class="color-picker-btn" style="background:#4A2E1F;" onclick="setColor('#4A2E1F')"></div>
        <div class="color-picker-btn" style="background:#fff;" onclick="setColor('#ffffff')"></div>
        <div class="color-picker-btn" style="background:#000;" onclick="setColor('#000000')"></div>
        <div class="color-picker-btn" style="background:#ffd700;" onclick="setColor('#ffd700')"></div> </div>
    
    <label>شفافية الاسم:</label>
    <input type="range" id="textOpacity" min="0" max="1" step="0.1" value="1">

    <div class="section-title">4. تحديد موقع الاسم وحجمه</div>
    <div class="sliders-grid">
        <div>
            <label>الموقع الأفقي (X):</label>
            <input type="range" id="posX" min="0" max="100" value="50">
        </div>
        <div>
            <label>الموقع العمودي (Y):</label>
            <input type="range" id="posY" min="0" max="100" value="43">
        </div>
    </div>
    
    <label>حجم الخط (بالنسبة للعرض):</label>
    <input type="range" id="fontSize" min="10" max="250" value="55">

    <div class="section-title">5. العلامة المائية</div>
    <div style="display:flex; justify-content:space-between; align-items:center;">
        <label>إظهار العلامة المائية في الزاوية؟</label>
        <input type="checkbox" id="showWatermark" checked style="width:auto; margin:0;">
    </div>
    <label>شفافية العلامة المائية:</label>
    <input type="range" id="watermarkOpacity" min="0" max="1" step="0.1" value="0.7">

    <button class="btn-main" id="downloadBtn">تحميل الشهادة المصممة ✨</button>
    <button class="btn-secondary" id="resetBtn">إعادة تعيين الإعدادات 🧹</button>
</div>

<div class="preview-area">
    <div class="status-bar" id="statusBar">في انتظار الصورة...</div>
    <canvas id="certCanvas"></canvas>
</div>

<script>
    const canvas = document.getElementById('certCanvas');
    const ctx = canvas.getContext('2d');
    const statusBar = document.getElementById('statusBar');
    
    // عناصر التحكم
    const controls = {
        bgFile: document.getElementById('bgFileInput'),
        bgUrl: document.getElementById('bgUrlInput'),
        loadUrl: document.getElementById('loadUrlBtn'),
        fontFile: document.getElementById('fontFileInput'),
        savedFonts: document.getElementById('savedFontsSelect'),
        name: document.getElementById('studentName'),
        color: document.getElementById('fontColor'),
        colorHex: document.getElementByIdHex('colorHex'),
        textOpacity: document.getElementById('textOpacity'),
        posX: document.getElementById('posX'),
        posY: document.getElementById('posY'),
        fontSize: document.getElementById('fontSize'),
        showWatermark: document.getElementById('showWatermark'),
        watermarkOpacity: document.getElementById('watermarkOpacity'),
        download: document.getElementById('downloadBtn')
    };

    // بيانات التصميم
    let designData = {
        bg: new Image(),
        watermark: new Image(),
        customFont: null,
        fontFamily: "'Cairo', sans-serif"
    };

    // 1. إعداد العلامة المائية (كيمو 13.png)
    designData.watermark.src = 'https://kemo-omar.github.io/Kareem/13.png';
    designData.watermark.crossOrigin = "Anonymous"; // عشان مشاكل الـ CORS لو حملت من دومين مختلف
    designData.watermark.onload = () => { if (designData.bg.src) updatePreview(); };

    // 2. نظام حفظ الخطوط (IndexedDB - عشان تفضل محفوظة حتى لو قفلت المتصفح)
    const dbName = "KemoFontStudioDB";
    const storeName = "fonts";
    let db;

    const request = indexedDB.open(dbName, 1);
    request.onupgradeneeded = (e) => {
        db = e.target.result;
        db.createObjectStore(storeName, { keyPath: "name" });
    };
    request.onsuccess = (e) => {
        db = e.target.result;
        loadSavedFonts(); // تحميل الخطوط للقائمة فوراً
    };

    // 3. معالجة رفع الخلفية (ملف)
    controls.bgFile.onchange = (e) => {
        const reader = new FileReader();
        reader.onload = (event) => { loadBgImage(event.target.result); };
        reader.readAsDataURL(e.target.files[0]);
    };

    // 4. معالجة تحميل الخلفية (رابط)
    controls.loadUrl.onclick = () => {
        const url = controls.bgUrl.value;
        if (!url) return alert("ضع رابط الصورة أولاً!");
        loadBgImage(url);
    };

    function loadBgImage(src) {
        statusBar.innerText = "جاري تحميل الصورة... ⏳";
        designData.bg.src = src;
        designData.bg.crossOrigin = "Anonymous"; // مهم جداً لتحميل الصور من روابط خارجية
        designData.bg.onload = () => {
            canvas.width = designData.bg.width;
            canvas.height = designData.bg.height;
            statusBar.innerText = `تم تحميل الخلفية (${canvas.width}x${canvas.height}) ✅`;
            updatePreview();
        };
        designData.bg.onerror = () => {
            statusBar.innerText = "فشل تحميل الصورة. تأكد من الرابط أو الملف. ❌";
            alert("فشل تحميل الصورة. قد يكون الرابط محمياً أو غير صحيح.");
        };
    }

    // 5. معالجة رفع الخط وحفظه
    controls.fontFile.onchange = (e) => {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.onload = async (event) => {
            const fontName = file.name.split('.')[0];
            const fontBuffer = event.target.result;
            
            statusBar.innerText = `جاري تحميل وحفظ الخط: ${fontName}... ⏳`;
            
            // تحميل الخط للمتصفح
            designData.customFont = new FontFace(fontName, fontBuffer);
            await designData.customFont.load();
            document.fonts.add(designData.customFont);
            
            // حفظ الخط في IndexedDB
            const tx = db.transaction(storeName, "readwrite");
            const store = tx.objectStore(storeName);
            store.put({ name: fontName, data: fontBuffer });
            
            designData.fontFamily = `'${fontName}'`;
            updatePreview();
            loadSavedFonts(); // تحديث القائمة
            statusBar.innerText = `تم تفعيل وحفظ الخط ✅`;
        };
        reader.readAsArrayBuffer(file);
    };

    // 6. تفعيل خط محفوظ
    controls.savedFonts.onchange = async (e) => {
        const fontName = e.target.value;
        if (!fontName) {
            designData.fontFamily = "'Cairo', sans-serif";
            updatePreview();
            return;
        }

        statusBar.innerText = `جاري تفعيل الخط المحفوظ: ${fontName}... ⏳`;
        
        // جلب الخط من IndexedDB
        const tx = db.transaction(storeName, "readonly");
        const store = tx.objectStore(storeName);
        const requestFont = store.get(fontName);
        
        requestFont.onsuccess = async () => {
            const fontData = requestFont.result.data;
            designData.customFont = new FontFace(fontName, fontData);
            await designData.customFont.load();
            document.fonts.add(designData.customFont);
            
            designData.fontFamily = `'${fontName}'`;
            updatePreview();
            statusBar.innerText = `تم تفعيل الخط ✅`;
        };
    };

    function loadSavedFonts() {
        const tx = db.transaction(storeName, "readonly");
        const store = tx.objectStore(storeName);
        const requestAll = store.getAll();
        
        requestAll.onsuccess = () => {
            const fonts = requestAll.result;
            controls.savedFonts.innerHTML = '<option value="">-- اختر خطاً محفوظاً --</option>';
            fonts.forEach(font => {
                const option = document.createElement('option');
                option.value = font.name;
                option.innerText = font.name;
                controls.savedFonts.appendChild(option);
            });
        };
    }

    // 7. التحكم في اللون المطور
    controls.color.oninput = (e) => {
        controls.colorHex.value = e.target.value.toUpperCase();
        updatePreview();
    };
    controls.colorHex.oninput = (e) => {
        if (/^#[0-9A-F]{6}$/i.test(e.target.value)) {
            controls.color.value = e.target.value;
            updatePreview();
        }
    };
    function setColor(hex) {
        controls.color.value = hex;
        controls.colorHex.value = hex.toUpperCase();
        updatePreview();
    }

    // 8. تحديث المعاينة فوراً عند أي تغيير
    const autoUpdateElements = ['name', 'textOpacity', 'posX', 'posY', 'fontSize', 'showWatermark', 'watermarkOpacity'];
    autoUpdateElements.forEach(key => {
        controls[key].oninput = updatePreview;
    });

    // دالة الرسم الأساسية (المعاملات هي اللي بتحدد شكل الشهادة)
    function updatePreview() {
        if (!designData.bg.src) return;

        // رسم الخلفية
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(designData.bg, 0, 0);

        // أ) رسم العلامة المائية (في الزاوية يمين تحت)
        if (controls.showWatermark.checked && designData.watermark.complete) {
            ctx.save();
            ctx.globalAlpha = controls.watermarkOpacity.value;
            
            // حساب حجم وموقع العلامة المائية (مثلاً 15% من عرض الشهادة)
            const wWidth = canvas.width * 0.15;
            const wHeight = (designData.watermark.height / designData.watermark.width) * wWidth;
            const wX = canvas.width - wWidth - (canvas.width * 0.02); // هامش 2% من اليمين
            const wY = canvas.height - wHeight - (canvas.height * 0.02); // هامش 2% من تحت
            
            ctx.drawImage(designData.watermark, wX, wY, wWidth, wHeight);
            ctx.restore();
        }

        // ب) رسم اسم الطالب
        if (controls.name.value) {
            ctx.save();
            ctx.globalAlpha = controls.textOpacity.value; // شفافية النص
            
            // حساب حجم الخط بالنسبة المئوية
            const size = (canvas.width * (controls.fontSize.value / 1000)); 
            ctx.font = `bold ${size}px ${designData.fontFamily}`;
            ctx.textAlign = 'center';
            ctx.fillStyle = controls.color.value;

            // حساب الموقع المظبوط (X, Y)
            const x = canvas.width * (controls.posX.value / 100);
            const y = canvas.height * (controls.posY.value / 100);
            
            ctx.fillText(controls.name.value, x, y);
            ctx.restore();
        }
    }

    // 9. التحميل
    controls.download.onclick = () => {
        if (!designData.bg.src) return alert("ارفع صورة أولاً!");
        
        statusBar.innerText = "جاري إنشاء الشهادة للتحميل... ⏳";
        
        // جودة عالية عند التحميل
        const dataUrl = canvas.toDataURL('image/png', 1.0); 
        const link = document.createElement('a');
        link.download = `شهادة_كيمو_${controls.name.value}.png`;
        link.href = dataUrl;
        link.click();
        
        statusBar.innerText = "تم التحميل بنجاح ✨ ✅";
    };

    // 10. إعادة التعيين
    document.getElementById('resetBtn').onclick = () => {
        if (confirm("هل أنت متأكد من إعادة تعيين كافة الإعدادات؟")) {
            location.reload();
        }
    };

</script>

</body>
</html>
