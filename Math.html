<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الرياضيات - كريم عمر</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBMBd9C41EyU7kWi06CVMgXrYFBVAvU1v8",
            authDomain: "shapap-13c58.firebaseapp.com",
            databaseURL: "https://shapap-13c58-default-rtdb.firebaseio.com",
            projectId: "shapap-13c58",
            storageBucket: "shapap-13c58.firebasestorage.app",
            messagingSenderId: "818487036065",
            appId: "1:818487036065:web:350734adcc4fcd779c48e0",
            measurementId: "G-8L138W57KK"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.saveToFirebase = function(studentName, score) {
            try {
                const resultsRef = ref(db, 'results');
                const newResultRef = push(resultsRef);
                set(newResultRef, {
                    name: studentName,
                    score: score,
                    total: 20,
                    timestamp: new Date().toLocaleString()
                });
            } catch(e) { console.error(e); }
        };
    </script>

    <style>
        :root {
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --primary: #38bdf8;
            --secondary: #818cf8;
            --success: #10b981;
            --error: #ef4444;
            --text: #f1f5f9;
        }

        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; }

        body {
            background: radial-gradient(circle at top right, #1e293b, #0f172a);
            color: var(--text);
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 850px;
            perspective: 1000px;
        }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: all 0.5s ease;
        }

        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { margin: 0; color: var(--primary); font-size: 2rem; letter-spacing: -1px; }
        .header p { color: #94a3b8; margin: 5px 0; font-size: 0.9rem; }

        /* Input Styles */
        .input-group { margin: 25px 0; position: relative; }
        input[type="text"] {
            width: 100%;
            padding: 15px 20px;
            background: rgba(15, 23, 42, 0.5);
            border: 2px solid #334155;
            border-radius: 12px;
            color: white;
            font-size: 1.1rem;
            outline: none;
            transition: 0.3s;
        }
        input[type="text"]:focus { border-color: var(--primary); box-shadow: 0 0 15px rgba(56, 189, 248, 0.2); }

        /* Question Styles */
        .q-box { display: none; animation: slideIn 0.5s forwards; }
        .q-box.active { display: block; }
        .q-text { font-size: 1.25rem; margin-bottom: 25px; line-height: 1.7; }

        .options-grid { display: grid; gap: 15px; }
        .opt-btn {
            background: rgba(51, 65, 85, 0.4);
            border: 1px solid #475569;
            padding: 16px;
            border-radius: 15px;
            color: var(--text);
            cursor: pointer;
            text-align: right;
            transition: 0.2s;
            font-size: 1.05rem;
        }
        .opt-btn:hover { background: rgba(71, 85, 105, 0.6); transform: translateY(-2px); }
        .opt-btn.selected { background: var(--primary); color: #0f172a; font-weight: 700; border-color: var(--primary); }

        /* Progress Bar */
        .progress-container { height: 8px; background: #334155; border-radius: 4px; margin-bottom: 30px; overflow: hidden; }
        .progress-bar { height: 100%; background: linear-gradient(90deg, var(--secondary), var(--primary)); width: 0%; transition: 0.4s; }

        /* Buttons */
        .btn {
            padding: 12px 30px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            transition: 0.3s;
        }
        .btn-primary { background: var(--primary); color: #0f172a; }
        .btn-primary:hover { opacity: 0.9; transform: scale(1.05); }
        .btn-outline { background: transparent; border: 1px solid #475569; color: var(--text); }

        /* Review Screen */
        .review-item {
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 10px;
            border-right: 5px solid transparent;
        }
        .review-correct { background: rgba(16, 185, 129, 0.1); border-right-color: var(--success); }
        .review-wrong { background: rgba(239, 68, 68, 0.1); border-right-color: var(--error); }

        @keyframes slideIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* Custom Modal */
        #custom-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center; align-items: center;
        }
        .modal-content {
            background: var(--card-bg);
            padding: 30px; border-radius: 20px; text-align: center; max-width: 400px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="glass-card" id="main-card">
        <div class="header">
            <h1>بنك أسئلة الرياضيات</h1>
            <p>برمجة: <b>كريم عمر</b> |<b> محمد زناتي</b></p>
        </div>

        <div id="login-section">
            <div class="input-group">
                <input type="text" id="studentName" placeholder="الاسم الرباعي للطالب...">
            </div>
            <button class="btn btn-primary" style="width: 100%;" onclick="startExam()">دخول الاختبار</button>
        </div>

        <div id="quiz-section" style="display:none;">
            <div class="progress-container"><div class="progress-bar" id="p-bar"></div></div>
            <div id="q-container"></div>
            <div style="display: flex; justify-content: space-between; margin-top: 30px;">
                <button class="btn btn-outline" id="prevBtn" onclick="move(-1)">السابق</button>
                <button class="btn btn-primary" id="nextBtn" onclick="move(1)">التالي</button>
                <button class="btn btn-primary" id="submitBtn" style="display:none; background: var(--success);" onclick="showConfirm()">تسليم النهائي</button>
            </div>
        </div>

        <div id="result-section" style="display:none;">
            <div style="text-align: center; margin-bottom: 40px;">
                <h2 id="final-msg" style="color: var(--primary);"></h2>
                <div style="font-size: 4rem; font-weight: 800; margin: 10px 0;" id="final-score">0/20</div>
                <p>إليك مراجعة لإجاباتك:</p>
            </div>
            <div id="review-list"></div>
            <button class="btn btn-primary" style="width: 100%; margin-top: 20px;" onclick="location.reload()">إعادة الاختبار</button>
        </div>
    </div>
</div>

<div id="custom-modal">
    <div class="modal-content">
        <h3 id="modal-title">تنبيه</h3>
        <p id="modal-text"></p>
        <div style="display: flex; gap: 10px; justify-content: center;">
            <button class="btn btn-outline" onclick="closeModal()">إلغاء</button>
            <button class="btn btn-primary" id="confirm-btn">تأكيد</button>
        </div>
    </div>
</div>

<script>
    const questions = [
        { 
            q: "إذا كان ( س ، 6 ) - ( 1 ، ص ) = ( 2 ، 5 ) فإن س + ص = ...", 
            options: ["1", "2", "4", "5"], 
            correct: 2 
        },
        { 
            q: "إذا كانت المصفوفة أ = <br> [ 0 &nbsp;&nbsp; 2س-5 ] <br> [ 12 &nbsp;&nbsp; 0 ] <br> شبه متماثلة، فإن س = ...", 
            options: ["2", "4", "-2", "-4"], 
            correct: 1 
        },
        { 
            q: "إذا كانت أ ، ب مصفوفتان بحيث أ ب = I (مصفوفة الوحدة)، فإن أ⁻¹ يساوي:", 
            options: ["ب", "أ", "I", "ب⁻¹"], 
            correct: 0 
        },
        { 
            q: "المصفوفة <br> [ س+4 &nbsp;&nbsp; 0 ] <br> [ 0 &nbsp;&nbsp; س-4 ] <br> ليس لها معكوس ضربي عندما س تنتمي لـ:", 
            options: ["{4}", "{-4}", "{4, -4}", "{0}"], 
            correct: 2 
        },
        { 
            q: "قيمة س التي تحقق: <br> [ 2 &nbsp;&nbsp; س ] = [ 2 &nbsp;&nbsp; 4 ] <br> [ 3 &nbsp;&nbsp; 5 ] &nbsp;&nbsp; [ 3 &nbsp;&nbsp; 5 ]", 
            options: ["2", "3", "4", "5"], 
            correct: 2 
        },
        { 
            q: "إذا كان: <br> [ 3 &nbsp; 2 ] [ 2 &nbsp;&nbsp; 1 ] = [ 6 &nbsp; 1 ] <br> [ س &nbsp; 1 ] [ 0 &nbsp; -1 ] &nbsp; [ 4 &nbsp; 1 ] <br> فإن س = ...", 
            options: ["2", "3", "4", "5"], 
            correct: 0 
        },
        { 
            q: "جا²(180° - θ) + جا²(270° - θ) = ...", 
            options: ["جا²θ", "جتا²θ", "1", "صفر"], 
            correct: 2 
        },
        { 
            q: "قيمة المقدار: قتا θ جا θ + 2 جتا θ قا θ + 3 ظتا θ ظا θ =", 
            options: ["4", "5", "6", "1"], 
            correct: 2 
        },
        { 
            q: "إذا كان أ + ب = 90° ، فإن ظا أ ظا ب = ...", 
            options: ["صفر", "1", "-1", "2"], 
            correct: 1 
        },
        { 
            q: "قطاع دائري محيطه 44 سم وطول نصف قطر دائرته 14 سم، فإن طول قوسه (ل) =", 
            options: ["8", "14", "16", "32"], 
            correct: 2 
        },
        { 
            q: "مساحة المثلث الذي أطوال أضلاعه 6 سم ، 8 سم ، 10 سم تساوي:", 
            options: ["24 سم²", "30 سم²", "48 سم²", "60 سم²"], 
            correct: 0 
        },
        { 
            q: "الصورة القطبية للمتجه ن = ( 3 ، 3√3 ) هي:", 
            options: ["( 6 ، 30° )", "( 6 ، 60° )", "( 3 ، 60° )", "( 6 ، 120° )"], 
            correct: 1 
        },
        { 
            q: "إذا كان أ = ( ك ، 2 ) ، ب = ( 2 ، ك-5 ) وكان أ ⊥ ب، فإن ك = ...", 
            options: ["1", "2", "-1", "-2"], 
            correct: 1 
        },
        { 
            q: "م هي نقطة تلاقي متوسطات المثلث أ ب ج، فإن المتجه م أ + م ب + م ج =", 
            options: ["أ ب", "أ ج", "و (المتجه الصفري)", "2 م أ"], 
            correct: 2 
        },
        { 
            q: "طول العمود المرسوم من النقطة ( 4 ، -2 ) على المستقيم 3س + 4ص - 25 = 0 هو:", 
            options: ["3 وحدات", "4 وحدات", "5 وحدات", "7 وحدات"], 
            correct: 2 
        },
        { 
            q: "قياس الزاوية بين المستقيمين: س - 2 = 0 ، ص + 5 = 0 يساوي:", 
            options: ["30°", "45°", "60°", "90°"], 
            correct: 3 
        },
        { 
            q: "المستقيم 3س + 4ص = 12 يصنع مع محوري الإحداثيات مثلثاً مساحته:", 
            options: ["4 وحدات مربعة", "6 وحدات مربعة", "12 وحدة مربعة", "24 وحدة مربعة"], 
            correct: 1 
        },
        { 
            q: "النقطة التي تنتمي لمجموعة حل المتباينات: س ≥ 0 ، ص ≥ 0 ، س + ص ≤ 4 هي:", 
            options: ["( 1 ، 1 )", "( 5 ، 0 )", "( 2 ، 3 )", "( 0 ، 6 )"], 
            correct: 0 
        },
        { 
            q: "حل المعادلة جتا θ = 1/2 حيث θ زاوية حادة هو:", 
            options: ["30°", "45°", "60°", "90°"], 
            correct: 2 
        },
        { 
            q: "إذا كانت جـ منتصف القطعة أ ب ، حيث أ = ( 1 ، 3 ) ، ب = ( 5 ، 1 ) فإن جـ = ...", 
            options: ["( 2 ، 3 )", "( 3 ، 2 )", "( 6 ، 4 )", "( 4 ، 6 )"], 
            correct: 1 
        }
    ];

    // لتعديل شكل المصفوفات في العرض، استخدمنا وسم <br> ومسافات &nbsp;
    // تقدر برضه تستخدم CSS عشان تخلي الـ .q-text تعرض الـ HTML بشكل مظبوط

    let currentIdx = 0;
    let userAnswers = new Array(20).fill(null);
    let studentName = "";

    function startExam() {
        studentName = document.getElementById('studentName').value.trim();
        if (studentName.split(' ').length < 3) {
            alertModal("خطأ", "يجب إدخال اسمك الرباعي للتسجيل.");
            return;
        }
        document.getElementById('login-section').style.display = 'none';
        document.getElementById('quiz-section').style.display = 'block';
        renderQuestion();
    }

    function renderQuestion() {
        const q = questions[currentIdx];
        const container = document.getElementById('q-container');
        container.innerHTML = `
            <div class="q-box active">
                <div class="q-text"><b>سؤال ${currentIdx + 1}:</b> ${q.q}</div>
                <div class="options-grid">
                    ${q.options.map((opt, i) => `
                        <button class="opt-btn ${userAnswers[currentIdx] === i ? 'selected' : ''}" 
                                onclick="selectOpt(${i})">${opt}</button>
                    `).join('')}
                </div>
            </div>
        `;
        updateUI();
    }

    function selectOpt(i) {
        userAnswers[currentIdx] = i;
        renderQuestion();
    }

    function move(step) {
        currentIdx += step;
        renderQuestion();
    }

    function updateUI() {
        document.getElementById('p-bar').style.width = ((currentIdx + 1) / 20 * 100) + '%';
        document.getElementById('prevBtn').style.visibility = currentIdx === 0 ? 'hidden' : 'visible';
        document.getElementById('nextBtn').style.display = currentIdx === 19 ? 'none' : 'block';
        document.getElementById('submitBtn').style.display = currentIdx === 19 ? 'block' : 'none';
    }

    function showConfirm() {
        if (userAnswers.includes(null)) {
            alertModal("تنبيه", "هناك أسئلة لم يتم حلها، هل أنت متأكد من التسليم؟", true, submitFinal);
        } else {
            alertModal("تأكيد", "هل أنت متأكد من إنهاء الاختبار؟", true, submitFinal);
        }
    }

    function submitFinal() {
        let score = 0;
        const reviewList = document.getElementById('review-list');
        reviewList.innerHTML = "";

        questions.forEach((q, i) => {
            const isCorrect = userAnswers[i] === q.correct;
            if (isCorrect) score++;
            
            reviewList.innerHTML += `
                <div class="review-item ${isCorrect ? 'review-correct' : 'review-wrong'}">
                    <b>س ${i+1}:</b> ${q.q}<br>
                    <small>إجابتك: ${userAnswers[i] !== null ? q.options[userAnswers[i]] : 'لم يتم الحل'}</small> | 
                    <small style="color:var(--primary)">الصح: ${q.options[q.correct]}</small>
                </div>
            `;
        });

        window.saveToFirebase(studentName, score);
        document.getElementById('quiz-section').style.display = 'none';
        document.getElementById('result-section').style.display = 'block';
        document.getElementById('final-score').innerText = `${score} / 20`;
        document.getElementById('final-msg').innerText = score >= 16 ? "أداء مبهر!" : "جيد، حاول المذاكرة أكثر.";
        closeModal();
    }

    // Modal System
    function alertModal(title, text, isConfirm = false, action = null) {
        document.getElementById('modal-title').innerText = title;
        document.getElementById('modal-text').innerText = text;
        const confirmBtn = document.getElementById('confirm-btn');
        confirmBtn.style.display = isConfirm ? 'block' : 'none';
        confirmBtn.onclick = action;
        document.getElementById('custom-modal').style.display = 'flex';
    }

    function closeModal() { document.getElementById('custom-modal').style.display = 'none'; }
</script>

</body>
</html>
