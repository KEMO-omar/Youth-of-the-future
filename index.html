<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>شباب المستقبل | المنصة التعليمية</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Orbitron:wght@900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root {
            --p: #00f2ff; --s: #bc00ff; --a: #ccff00; --bg: #050505;
            --glass: rgba(255, 255, 255, 0.07);
        }
        * { box-sizing: border-box; scroll-behavior: smooth; }
        body { 
            margin: 0; background: var(--bg); color: #fff; font-family: 'Cairo', sans-serif; overflow-x: hidden; 
        }

        /* نافبار */
        nav.cosmic-nav {
            position: fixed; top: 15px; left: 50%; transform: translateX(-50%);
            background: rgba(10, 10, 10, 0.85); backdrop-filter: blur(20px);
            padding: 10px 20px; border-radius: 50px; border: 2px solid var(--p);
            display: flex; gap: 15px; z-index: 1000; width: max-content;
        }
        .nav-link { color: #fff; text-decoration: none; font-weight: 700; font-size: 0.8rem; cursor: pointer; transition: 0.3s; }
        .nav-link.active { color: var(--a); text-shadow: 0 0 10px var(--a); }

        .container { padding-top: 100px; max-width: 1100px; margin: 0 auto; padding-inline: 15px; }
        .page { display: none; animation: fadeIn 0.5s ease-in-out; }
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* ستايل الكروت والقسم الإداري */
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .card { background: var(--glass); padding: 30px; border-radius: 20px; border: 1px solid var(--p); text-align: center; }
        .btn { padding: 10px 25px; border-radius: 50px; border: none; cursor: pointer; font-weight: 700; transition: 0.3s; }
        .btn-p { background: var(--p); color: #000; }
        
        /* أيقونة الأدمن المخفية */
        .admin-trigger {
            position: fixed; bottom: 5px; right: 5px; width: 15px; height: 15px;
            background: rgba(255,255,255,0.05); border-radius: 50%;
            cursor: pointer; z-index: 9999;
        }
        .admin-trigger:hover { background: var(--a); }

        /* فورم الإضافة */
        .admin-panel { background: #111; padding: 20px; border-radius: 15px; border: 1px solid var(--a); margin-top: 20px; }
        .input-group { margin-bottom: 15px; text-align: right; }
        input, select, textarea { 
            width: 100%; padding: 12px; background: #222; border: 1px solid #444; color: #fff; border-radius: 8px; margin-top: 5px;
        }
        .option-input { display: flex; align-items: center; gap: 10px; margin-bottom: 5px; }
        .is-correct-btn { background: #444; border: none; padding: 5px 10px; border-radius: 5px; color: #fff; cursor: pointer; }
        .is-correct-btn.active { background: var(--a); color: #000; }

        /* واجهة الامتحان */
        .quiz-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: #111; padding: 15px; border-radius: 10px; }
        .question-card { background: #1a1a1a; padding: 25px; border-radius: 15px; border-right: 5px solid var(--p); margin-bottom: 20px; }
        .option-card { 
            background: #252525; padding: 15px; border-radius: 10px; margin-bottom: 10px; 
            cursor: pointer; border: 1px solid transparent; transition: 0.2s;
        }
        .option-card:hover { border-color: var(--p); }
        .option-card.selected { background: rgba(0, 242, 255, 0.2); border-color: var(--p); }
        
        .timer { font-family: 'Orbitron'; font-size: 1.5rem; color: var(--a); }
    </style>
</head>
<body>

<nav class="cosmic-nav">
  <a class="nav-link active" onclick="showPage('home')">🏠 الرئيسية</a>
  <a class="nav-link" onclick="showPage('exams')">📝 الامتحانات</a>
  <a class="nav-link" onclick="showPage('admin-login')" id="adminNavLink" style="display:none;">⚙️ لوحة التحكم</a>
</nav>

<div class="container">
    
    <section id="home" class="page active">
        <div style="text-align:center;">
            <h1 class="main-name" style="font-family: 'Orbitron'; font-size: 3rem; color: var(--p);">YOUTH FUTURE</h1>
            <p>أهلاً بك في مستقبل التعليم 🚀</p>
            <button class="main-btn btn btn-p" onclick="showPage('exams')">ابدأ التحدي الآن</button>
        </div>
    </section>

    <section id="exams" class="page">
        <h2 style="color:var(--a); text-align:center;">الامتحانات المتاحة</h2>
        <div id="examsList" class="grid">
            </div>
    </section>

    <section id="quiz-view" class="page">
        <div class="quiz-header">
            <div id="studentInfo">الطالب: <span id="displayStudentName"></span></div>
            <div class="timer" id="quizTimer">00:00</div>
        </div>
        <div id="questionContainer"></div>
        <div style="display:flex; justify-content: space-between;">
            <button class="btn btn-p" onclick="prevQuestion()">السابق</button>
            <button class="btn btn-p" onclick="nextQuestion()" id="nextBtn">التالي</button>
        </div>
    </section>

    <section id="admin-panel" class="page">
        <h2 style="color:var(--a);">إضافة امتحان جديد</h2>
        <div class="admin-panel">
            <input type="text" id="examTitle" placeholder="اسم المادة / عنوان الامتحان">
            <input type="number" id="examDuration" placeholder="المدة بالدقائق">
            <hr>
            <div id="questionsBuilder">
                </div>
            <button class="btn btn-p" onclick="addQuestionUI()" style="background:var(--s); color:#fff;">+ إضافة سؤال</button>
            <button class="btn btn-p" onclick="saveExamToFirebase()" style="background:var(--a); color:#000;">حفظ ونشر الامتحان</button>
        </div>
        
        <h2 style="color:var(--p); margin-top:40px;">نتائج الطلاب</h2>
        <div id="resultsTable" style="background:#111; padding:10px; border-radius:10px;">
            </div>
    </section>

</div>

<div class="admin-trigger" onclick="promptAdmin()"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBMBd9C41EyU7kWi06CVMgXrYFBVAvU1v8",
    authDomain: "shapap-13c58.firebaseapp.com",
    projectId: "shapap-13c58",
    storageBucket: "shapap-13c58.firebasestorage.app",
    messagingSenderId: "818487036065",
    appId: "1:818487036065:web:350734adcc4fcd779c48e0",
    measurementId: "G-8L138W57KK"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // المتغيرات العامة
  let currentQuestions = [];
  let userAnswers = {};
  let currentExamIndex = 0;
  let timer;
  let timeLeft;

  // إظهار الصفحات
  window.showPage = (id) => {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    if(id === 'exams') loadExams();
    if(id === 'admin-panel') loadResults();
  };

  // حماية الأدمن
  window.promptAdmin = async () => {
    const { value: password } = await Swal.fire({
      title: 'دخول الإدارة',
      input: 'password',
      inputPlaceholder: 'كلمة السر',
      background: '#111', color: '#fff'
    });
    if (password === '1234') { // يمكنك تغيير كلمة السر هنا
      document.getElementById('adminNavLink').style.display = 'block';
      showPage('admin-panel');
    }
  };

  // --- نظام بناء الأسئلة ---
  let builderQuestions = [];
  window.addQuestionUI = () => {
    const qId = Date.now();
    const html = `
      <div class="question-card" id="q-${qId}">
        <input type="text" placeholder="نص السؤال" class="q-text">
        <div class="options-area">
          ${[0,1,2,3].map(i => `
            <div class="option-input">
              <input type="text" placeholder="خيار ${i+1}" class="opt-${i}">
              <button class="is-correct-btn" onclick="this.parentElement.parentElement.querySelectorAll('.is-correct-btn').forEach(b=>b.classList.remove('active')); this.classList.add('active')">صح</button>
            </div>
          `).join('')}
        </div>
        <button onclick="this.parentElement.remove()" style="color:red; background:none; border:none; cursor:pointer;">حذف السؤال</button>
      </div>
    `;
    document.getElementById('questionsBuilder').insertAdjacentHTML('beforeend', html);
  };

  window.saveExamToFirebase = async () => {
    const cards = document.querySelectorAll('#questionsBuilder .question-card');
    const examData = {
      title: document.getElementById('examTitle').value,
      duration: parseInt(document.getElementById('examDuration').value),
      questions: []
    };

    cards.forEach(card => {
      const opts = [];
      let correctIdx = 0;
      card.querySelectorAll('.option-input').forEach((oi, idx) => {
        opts.push(oi.querySelector('input').value);
        if(oi.querySelector('.is-correct-btn').classList.contains('active')) correctIdx = idx;
      });
      examData.questions.push({
        q: card.querySelector('.q-text').value,
        options: opts,
        ans: correctIdx
      });
    });

    try {
      await addDoc(collection(db, "exams"), examData);
      Swal.fire('تم!', 'تم نشر الامتحان بنجاح', 'success');
      showPage('exams');
    } catch (e) { console.error(e); }
  };

  // --- نظام تشغيل الامتحانات ---
  window.loadExams = async () => {
    const querySnapshot = await getDocs(collection(db, "exams"));
    const list = document.getElementById('examsList');
    list.innerHTML = '';
    querySnapshot.forEach((docSnap) => {
      const data = docSnap.data();
      list.innerHTML += `
        <div class="card">
          <h3>${data.title}</h3>
          <p>المدة: ${data.duration} دقيقة</p>
          <button class="btn btn-p" onclick="startExam('${docSnap.id}')">ابدأ الآن</button>
          <button onclick="deleteExam('${docSnap.id}')" style="display:block; margin: 10px auto; color:gray; font-size:10px; background:none; border:none;">حذف (أدمن)</button>
        </div>
      `;
    });
  };

  window.deleteExam = async (id) => {
    if(confirm('هل أنت متأكد من حذف هذا الامتحان؟')) {
      await deleteDoc(doc(db, "exams", id));
      loadExams();
    }
  };

  window.startExam = async (id) => {
    const { value: name } = await Swal.fire({
      title: 'أدخل اسمك الثلاثي',
      input: 'text',
      inputValidator: (value) => !value && 'لازم تكتب اسمك يا بطل',
      background: '#111', color: '#fff'
    });

    if(name) {
      const exams = await getDocs(collection(db, "exams"));
      const exam = exams.docs.find(d => d.id === id).data();
      
      currentQuestions = exam.questions;
      document.getElementById('displayStudentName').innerText = name;
      userAnswers = {};
      currentExamIndex = 0;
      timeLeft = exam.duration * 60;
      
      startTimer();
      renderQuestion();
      showPage('quiz-view');
    }
  };

  function startTimer() {
    timer = setInterval(() => {
      timeLeft--;
      let mins = Math.floor(timeLeft / 60);
      let secs = timeLeft % 60;
      document.getElementById('quizTimer').innerText = `${mins}:${secs < 10 ? '0'+secs : secs}`;
      if(timeLeft <= 0) finishExam();
    }, 1000);
  }

  window.renderQuestion = () => {
    const q = currentQuestions[currentExamIndex];
    let html = `<h3>${currentExamIndex + 1}. ${q.q}</h3>`;
    q.options.forEach((opt, i) => {
      html += `
        <div class="option-card ${userAnswers[currentExamIndex] === i ? 'selected' : ''}" onclick="selectAnswer(${i})">
          ${opt}
        </div>
      `;
    });
    document.getElementById('questionContainer').innerHTML = html;
    document.getElementById('nextBtn').innerText = currentExamIndex === currentQuestions.length - 1 ? 'تسليم الامتحان' : 'التالي';
  };

  window.selectAnswer = (idx) => {
    userAnswers[currentExamIndex] = idx;
    renderQuestion();
  };

  window.nextQuestion = () => {
    if(currentExamIndex < currentQuestions.length - 1) {
      currentExamIndex++;
      renderQuestion();
    } else {
      finishExam();
    }
  };

  window.prevQuestion = () => {
    if(currentExamIndex > 0) {
      currentExamIndex--;
      renderQuestion();
    }
  };

  window.finishExam = async () => {
    const result = await Swal.fire({
      title: 'هل أنت متأكد؟',
      text: "تأكد من إجابة كل الأسئلة قبل التسليم",
      icon: 'warning',
      showCancelButton: true,
      confirmButtonText: 'نعم، سلم الآن',
      background: '#111', color: '#fff'
    });

    if(result.isConfirmed) {
      clearInterval(timer);
      let score = 0;
      currentQuestions.forEach((q, i) => {
        if(userAnswers[i] === q.ans) score++;
      });

      const finalScore = Math.round((score / currentQuestions.length) * 100);
      
      await addDoc(collection(db, "results"), {
        name: document.getElementById('displayStudentName').innerText,
        score: finalScore,
        date: new Date().toLocaleString()
      });

      Swal.fire('تم التسليم!', `درجتك هي: ${finalScore}%`, 'success');
      showPage('home');
    }
  };

  window.loadResults = async () => {
    const querySnapshot = await getDocs(collection(db, "results"));
    let html = '<table><tr><th>الطالب</th><th>الدرجة</th><th>التاريخ</th></tr>';
    querySnapshot.forEach(doc => {
      const d = doc.data();
      html += `<tr><td>${d.name}</td><td>${d.score}%</td><td>${d.date}</td></tr>`;
    });
    html += '</table>';
    document.getElementById('resultsTable').innerHTML = html;
  };

</script>

<canvas id="cosmos" style="position:fixed; top:0; left:0; pointer-events:none; z-index:-1;"></canvas>
<script>
  // إضافة كود الـ Canvas Animation هنا إذا أردت استمراره
</script>

</body>
</html>
